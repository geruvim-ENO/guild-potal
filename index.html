<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="twitter:description" content="RF 온라인 넥스트 · 웰즈4 — 길드 운영 통합 관리">
<meta name="twitter:image" content="https://geruvim-eno.github.io/guild-potal/preview.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230A0F1C'/%3E%3Ctext y='68' x='50' font-size='54' text-anchor='middle' fill='%23F5A524' font-family='sans-serif' font-weight='bold'%3E防%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0F1C; --panel:rgba(17,26,44,.88); --panel2:rgba(13,21,36,.9); --line:#1E2A42;
  --txt:#E8EFF9; --mut:#8496B0; --cyan:#3BD6E8; --amber:#F5A524;
  --red:#FF5D6C; --green:#4ADE80; --gold:#FFD166;
  --bellato:#3B82F6; --cora:#A855F7; --accretia:#EF4444;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
/* ---- RF풍 우주 배경 (자체 제작, 40% 투명도) ---- */
#space{position:fixed;inset:0;z-index:-1;opacity:.4;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 75% 15%, rgba(168,85,247,.45), transparent 60%),
    radial-gradient(ellipse 50% 35% at 15% 70%, rgba(59,130,246,.4), transparent 60%),
    radial-gradient(ellipse 45% 30% at 60% 85%, rgba(239,68,68,.3), transparent 65%),
    radial-gradient(ellipse 80% 60% at 40% 40%, rgba(59,214,232,.12), transparent 70%),
    #060A14;}
#stars{position:fixed;inset:0;z-index:-1;opacity:.4;pointer-events:none}
.num{font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:.02em}
.tri{height:3px;background:linear-gradient(90deg,var(--bellato),var(--cora),var(--accretia))}
header{position:sticky;top:0;z-index:50;background:rgba(10,15,28,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:'Rajdhani';font-weight:700;font-size:21px;letter-spacing:.06em}
.logo b{color:var(--cyan)}
.logo small{display:block;font-size:10px;color:var(--mut);letter-spacing:.25em;font-weight:600}
.hbtns{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.src{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.dot.live{background:var(--green);box-shadow:0 0 8px var(--green)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 14px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.primary{background:var(--cyan);color:#04222A;border-color:var(--cyan);font-weight:700}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{border-color:rgba(255,93,108,.5);color:var(--red)}
.btn.edit-on{background:var(--amber);color:#3A2600;border-color:var(--amber);font-weight:700}
.stats{display:flex;gap:8px;flex-wrap:nowrap;width:100%;overflow-x:auto;padding-bottom:2px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 13px;min-width:100px;flex:0 0 auto}
.stat .v{font-family:'Rajdhani';font-size:20px;font-weight:700;color:var(--cyan)}
.stat .l{font-size:11px;color:var(--mut);white-space:nowrap}
nav{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:none;color:var(--mut);font:inherit;font-weight:500;padding:11px 15px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button:hover{color:var(--txt)}
nav button.on{color:var(--cyan);border-bottom-color:var(--cyan);font-weight:700}
main{max-width:1280px;margin:0 auto;padding:18px 20px}
section{display:none}section.on{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;backdrop-filter:blur(4px)}
h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2::before{content:"";width:4px;height:15px;background:var(--cyan);border-radius:2px;flex:0 0 auto}
h2 .sub{font-size:12px;color:var(--mut);font-weight:400}
h2 .right{margin-left:auto;display:flex;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{color:var(--mut);font-size:12px;font-weight:700;background:#0D1524;box-shadow:0 1px 0 var(--line)}
/* 좌측 고정: 위치·순위·캐릭명 */
.tblwrap.frz td:nth-child(-n+3),.tblwrap.frz th:nth-child(-n+3){position:sticky;background:#0D1524;z-index:3}
.tblwrap.frz td:nth-child(1),.tblwrap.frz th:nth-child(1){left:0}
.tblwrap.frz td:nth-child(2),.tblwrap.frz th:nth-child(2){left:var(--c1,58px)}
.tblwrap.frz td:nth-child(3),.tblwrap.frz th:nth-child(3){left:var(--c2,110px)}
.tblwrap.frz tr:hover td:nth-child(-n+3){background:#122036}
/* 화면 상단에 떠서 따라오는 헤더 */
.floathdr{position:fixed;z-index:40;display:none;overflow:hidden;border-bottom:1px solid var(--cyan);
  box-shadow:0 6px 16px rgba(0,0,0,.5);background:#0D1524;border-radius:0}
.floathdr-in{overflow-x:scroll;scrollbar-width:none;-ms-overflow-style:none}
.floathdr-in::-webkit-scrollbar{display:none}
.floathdr table{border-collapse:collapse;table-layout:fixed}
.floathdr th{padding:7px 9px;text-align:left;white-space:nowrap;cursor:pointer;font-size:12px}
.floathdr-in.frz th:nth-child(-n+3){position:sticky;background:#0D1524;z-index:3}
.floathdr-in.frz th:nth-child(1){left:0}
.floathdr-in.frz th:nth-child(2){left:var(--c1,58px)}
.floathdr-in.frz th:nth-child(3){left:var(--c2,110px)}
/* 그룹 구분 라벨 */
.grouplbl{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-weight:700;font-size:14px}
.grouplbl .ln{flex:1;height:1px;background:var(--line)}
.grouplbl.in{color:var(--cyan)}
.grouplbl.out{color:var(--amber)}
/* 공대 편성 */
.ptbl{width:100%;border-collapse:collapse;table-layout:fixed}
.ptbl th,.ptbl td{border:1px solid var(--line);padding:7px 6px;text-align:center;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptbl .rolerow th{font-weight:700;font-size:12px}
.ptbl .teamrow th{background:#1D3A5C;color:#CFE6FF;font-weight:700}
.ptbl .side{background:#152238;color:var(--txt);font-weight:700;width:64px}
.ptbl td.mem{background:rgba(255,255,255,.02)}
.ptbl td.mem.dup{background:rgba(255,93,108,.16);color:#FFB3BA}
.ptbl td.mem.empty{color:#3A4966}
body.editing .ptbl td.mem,body.editing .ptbl th.role,body.editing .ptbl th.tname{cursor:pointer}
body.editing .ptbl td.mem:hover,body.editing .ptbl th.role:hover,body.editing .ptbl th.tname:hover{outline:1px dashed var(--amber);outline-offset:-1px}
.role-g{background:rgba(74,222,128,.18);color:#B6F0C8}
.role-p{background:rgba(236,72,153,.18);color:#F8C0DC}
.role-v{background:rgba(168,85,247,.20);color:#DCC8F8}
.role-b{background:rgba(59,130,246,.18);color:#BBD6FF}
.role-a{background:rgba(245,165,36,.18);color:#F8DCA8}
.pwrap{overflow-x:auto}
.pcount{font-size:12px;color:var(--mut);margin-top:6px}
.doc{max-width:900px}
.doc h3{font-size:15px;color:var(--cyan);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.doc h3:first-child{margin-top:0}
.doc h4{font-size:13.5px;color:var(--txt);margin:14px 0 6px}
.doc p,.doc li{font-size:13.5px;line-height:1.85;color:var(--txt)}
.doc ul,.doc ol{margin:6px 0 10px 20px}
.doc li{margin:3px 0}
.doc .step{display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.doc .step b{flex:0 0 26px;height:26px;line-height:26px;text-align:center;border-radius:50%;
  background:var(--cyan);color:#04222A;font-family:'Rajdhani';font-size:14px}
.doc .kbd{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;
  padding:1px 7px;font-family:'Rajdhani';font-weight:700;font-size:13px;color:var(--cyan)}
.doc .tip{border-left:3px solid var(--green);background:rgba(74,222,128,.07);padding:9px 13px;border-radius:0 8px 8px 0;margin:10px 0}
.doc .warn{border-left:3px solid var(--red);background:rgba(255,93,108,.07);padding:9px 13px;border-radius:0 8px 8px 0;margin:10px 0}
.doc table{margin:8px 0}
.doc td,.doc th{white-space:normal}
.ptbl .titlerow th{background:#0F2743;color:var(--cyan);font-size:14px;font-weight:700;letter-spacing:.05em;padding:9px}
.pflex{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pflex .pleft{flex:1 1 460px;min-width:0}
.pflex .pright{flex:0 1 300px;min-width:240px}
.notecard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--panel2)}
.notecard .nh{font-weight:700;font-size:12px;margin-bottom:5px;display:inline-block;padding:2px 8px;border-radius:4px}
.notecard .nb{font-size:12.5px;color:var(--txt);line-height:1.65;white-space:pre-wrap;min-height:20px}
.notecard .nb.empty{color:#4A5B75}
body.editing .notecard .nb{cursor:pointer}
body.editing .notecard .nb:hover{outline:1px dashed var(--amber);outline-offset:2px;border-radius:4px}
.notecard textarea{width:100%;min-height:86px;background:#16233A;border:1px solid var(--amber);border-radius:6px;color:var(--txt);padding:8px;font:inherit;font-size:12.5px;line-height:1.6;outline:none;resize:vertical}
@media(max-width:760px){.pflex .pright{flex:1 1 100%}}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--cyan)}
th .arr{opacity:.5;font-size:10px}
tr:hover td{background:rgba(59,214,232,.04)}
.center{text-align:center}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;-webkit-overflow-scrolling:touch}
.search{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.search input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:9px 14px;font:inherit;width:240px;outline:none;max-width:100%}
.search input:focus{border-color:var(--cyan)}
.hint{font-size:12px;color:var(--mut)}
.rank{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:2px 6px;font-family:'Rajdhani';font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.rank.r1{background:var(--gold);color:#3A2E00;border-color:var(--gold)}
.rank.r2{background:#C7D2E4;color:#1F2A3D;border-color:#C7D2E4}
.rank.r3{background:#C98A5B;color:#2E1A0A;border-color:#C98A5B}
.pbar{position:relative;background:var(--panel2);border-radius:5px;height:20px;min-width:110px;overflow:hidden}
.pbar i{position:absolute;inset:0;background:linear-gradient(90deg,rgba(59,214,232,.15),rgba(59,214,232,.55));border-right:2px solid var(--cyan)}
.pbar span{position:relative;display:block;text-align:right;padding:0 8px;font-family:'Rajdhani';font-weight:700;font-size:14px;line-height:20px}
.ox{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;font-family:'Rajdhani';font-weight:700}
.ox.o{background:rgba(74,222,128,.15);color:var(--green);box-shadow:inset 0 0 0 1px rgba(74,222,128,.4)}
.ox.x{background:rgba(132,150,176,.08);color:#5A6B85}
.ox.t{background:rgba(245,165,36,.15);color:var(--amber);font-size:10px;padding:0 6px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge.must{background:rgba(74,222,128,.12);color:var(--green)}
.badge.free{background:rgba(132,150,176,.12);color:var(--mut)}
.badge.no{background:rgba(255,93,108,.12);color:var(--red)}
.badge.yes{background:rgba(59,214,232,.12);color:var(--cyan)}
.pen{color:var(--red);font-family:'Rajdhani';font-weight:700}
.rules{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:16px;white-space:pre-wrap;font-size:13px;line-height:1.9}
.rules b{color:var(--amber)}
.rules[contenteditable]{border-color:var(--amber);min-height:320px;outline:none}
.rules ul,.rules ol{margin:6px 0 6px 22px;padding-left:6px}
.rules li{margin:3px 0;line-height:1.75}
.rules ul{list-style:disc}
.rules ul ul{list-style:circle}
.rules ol{list-style:decimal}
.rtb{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.rtb button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.rtb button:hover{border-color:var(--cyan)}
.rtb .sep{width:1px;background:var(--line);margin:0 3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px}
.chip.main{border-color:rgba(255,209,102,.5);color:var(--gold)}
.chip .del{color:var(--red);margin-left:6px;cursor:pointer;font-weight:700}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.calc input{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--cyan);padding:5px 8px;font-family:'Rajdhani';font-weight:600;width:88px;text-align:right;outline:none}
.calc input:focus{border-color:var(--cyan)}
.calc .res{color:var(--cyan);font-family:'Rajdhani';font-weight:700;font-size:15px}
.note{font-size:12px;color:var(--mut);margin-top:8px}
footer{max-width:1280px;margin:0 auto;padding:16px 20px 40px;color:var(--mut);font-size:12px;border-top:1px solid var(--line)}
/* ---- 수정 모드 ---- */
body.editing .editable{cursor:text}
body.editing #brandName,body.editing #brandSub{cursor:pointer;outline:1px dashed var(--amber);outline-offset:3px;border-radius:4px;display:inline-block}
body.editing .editable:hover{outline:1px dashed var(--amber);outline-offset:-1px}
td.dirty{outline:2px solid var(--amber)!important;outline-offset:-2px;background:rgba(245,165,36,.08)!important}
td input.cellinp,td select.cellinp{width:100%;min-width:60px;background:#1A2438;border:1px solid var(--amber);border-radius:4px;color:var(--txt);padding:3px 6px;font:inherit;outline:none}
.editbar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(20,14,2,.95);border-top:2px solid var(--amber);backdrop-filter:blur(8px)}
body.editing .editbar{display:block}
.editbar .in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.editbar .cnt{color:var(--amber);font-weight:700}
/* ---- 모달 ---- */
.modal-bg{position:fixed;inset:0;background:rgba(4,7,14,.75);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.on{display:flex}
.modal{background:#101A2E;border:1px solid var(--line);border-radius:14px;padding:24px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h3{font-size:16px;margin-bottom:10px;color:var(--cyan)}
.modal p{color:var(--mut);font-size:13px;margin-bottom:16px;white-space:pre-wrap}
.modal input[type=password]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:10px 14px;font:inherit;outline:none;margin-bottom:16px}
.modal input:focus{border-color:var(--cyan)}
.modal .mbtns{display:flex;gap:8px;justify-content:flex-end}
.modal .err{color:var(--red);font-size:12px;margin:-10px 0 12px;display:none}
.toast{position:fixed;top:70px;right:20px;z-index:120;background:#0E2B1C;border:1px solid var(--green);color:var(--green);padding:10px 18px;border-radius:10px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
.addrow{margin-top:10px}
/* ---- 반응형 ---- */
@media(max-width:900px){
  .grid2{grid-template-columns:1fr}
  .hwrap{padding:10px 14px}
  main{padding:12px 14px}
}
@media(max-width:640px){
  .logo{font-size:18px}
  .search input{width:100%}
  .stat{min-width:86px;padding:6px 10px}
  .stat .v{font-size:17px}
  th,td{padding:6px 7px;font-size:12px}
  .pbar{min-width:88px}
  .panel{padding:12px;border-radius:10px}
  .editbar .in{padding:10px 12px}
  .modal{padding:18px}
}
</style>
</head>
<body>
<div id="space"></div><canvas id="stars"></canvas>
<div class="tri"></div>
<header>
  <div class="hwrap">
    <div class="logo"><span id="brandName" title="수정 모드에서 클릭하면 길드명 변경">방탄한어른들</span> <b>GUILD PORTAL</b><small id="brandSub" title="수정 모드에서 클릭하면 부제 변경">RF ONLINE NEXT · WELLS-4</small></div>
    <div class="hbtns">
      <div class="src"><span class="dot" id="srcDot"></span><span id="srcTxt">데이터 확인 중…</span></div>
      <button class="btn" id="editToggle">🔒 수정 모드</button>
    </div>
    <div class="stats" id="statStrip"></div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<footer>
  데이터 원본: Google Sheets · 저장 시 시트에 직접 기록됩니다 ·
  <button class="btn" id="exportBtn" style="padding:3px 10px;font-size:11px">변경사항 내보내기(JSON)</button>
  <button class="btn" id="importBtn" style="padding:3px 10px;font-size:11px">가져오기</button>
  <input type="file" id="importFile" accept=".json" style="display:none">
</footer>

<div class="editbar"><div class="in">
  <span id="editRole">✏️ 수정 모드</span>
  <span class="cnt" id="dirtyCnt">변경 0건</span>
  <span style="margin-left:auto;display:flex;gap:8px">
    <button class="btn danger" id="resetBtn">스냅샷으로 초기화</button>
    <button class="btn" id="cancelBtn">변경 취소</button>
    <button class="btn primary" id="saveBtn">💾 저장</button>

const cvtFmt=v=>{ // 장비 표기 변환: 4T_프_15→4TP+15, 4T_3→4T+3
  if(v==null)return v;
  return String(v).replace(/_프_(\d+)$/,'P+$1').replace(/_(\d+)$/,'+$1');
};
function migrate(d){ // 구버전 데이터 자동 변환 + 누락 필드 보강
  try{
    if(d&&d.notice&&d.notice.schedule)
      d.notice.schedule=d.notice.schedule.map(r=>r.length===6?r.slice(1):r);
    if(d&&d.notice)delete d.notice.boss;
    if(d&&d.basic)d.basic.forEach(b=>{if(b.eq)b.eq=b.eq.map(cvtFmt);});
    if(d&&!d.basicHeaders)d.basicHeaders=SNAP.basicHeaders;
    if(d&&!d.skillHeaders)d.skillHeaders=SNAP.skillHeaders;
    if(d&&!d.notice)d.notice=JSON.parse(JSON.stringify(SNAP.notice));
    if(d&&d.notice)delete d.notice.mains;
    if(d&&!d.mau)d.mau=[];
    if(d&&d.basic)d.basic.forEach(b=>{if(!b.loc)b.loc='내근';});
    if(d&&d.skills)d.skills.forEach(s=>{if(!s.loc)s.loc='내근';});
    if(d&&!d.parties)d.parties=JSON.parse(JSON.stringify(SNAP.parties));
    if(d&&d.parties)Object.keys(d.parties).forEach(k=>{ // 역할명은 입력한 그대로 유지
      const g=d.parties[k];if(!g)return;g.notes=g.notes||{};
      if(g.roles)g.roles=g.roles.map(r=>(r||'').trim());
    });
    if(d&&d.skills&&d.skillHeaders)d.skills.forEach(s=>{ // 마유 칸 O/X → 완성/빈칸
      d.skillHeaders.forEach((h,i)=>{
        if(!COL_CFG.mau.includes(String(h).trim()))return;
        const v=String((s.vals||[])[i]||'').trim();
        if(v==='O')s.vals[i]='완성';else if(v==='X')s.vals[i]='';
      });});
    const fixLoc=v=>v==='출장'?'외근':(v||'내근');
    if(d&&d.basic)d.basic.forEach(b=>{b.loc=fixLoc(b.loc);});
    if(d&&d.skills)d.skills.forEach(s=>{s.loc=fixLoc(s.loc);});
    if(d&&d.notice&&Array.isArray(d.notice.roster))d.notice.roster=d.notice.roster.map(r=>{
      const a=r.slice();while(a.length<6)a.push('');
      if(!a[4])a[4]=(a[3]&&/부캐/.test(a[3]))?'부캐':'본캐';
      a[5]=(a[5]==='외근'||a[5]==='출장')?'외근':'내근'; // 명단 자체 위치(장비 탭과 별개)
      return a;});
    if(d&&!d.rosterCols)d.rosterCols={talk:true,notice:true};
    if(d&&!d.tabPerm)d.tabPerm=JSON.parse(JSON.stringify(SNAP.tabPerm));
    if(d&&!Array.isArray(d.auctionPrices))d.auctionPrices=JSON.parse(JSON.stringify(SNAP.auctionPrices));
    if(d&&!Array.isArray(d.tabsHidden))d.tabsHidden=[];
    if(d&&!d.guildName)d.guildName='방탄한어른들';
    if(d&&!d.subTitle)d.subTitle='RF ONLINE NEXT · WELLS-4';
  }catch(e){}
  return d;
}

/* ===== 3-way 병합: 시트 최신본 + 내 변경분 ===== */
function tagBi(d){['basic','skills','mau'].forEach(k=>{(d[k]||[]).forEach((o,i)=>{o._bi=i;});});return d;}
function stripBi(d){['basic','skills','mau'].forEach(k=>{(d[k]||[]).forEach(o=>{delete o._bi;});});return d;}
function mergeData(fresh,base,edit){
  const out=JSON.parse(JSON.stringify(fresh));
  const FIELDS={basic:['name','power','loc'],skills:['name','loc'],mau:['name','memo']};
  const ARR={basic:'eq',skills:'vals'};
  ['basic','skills','mau'].forEach(k=>{
    const bL=base[k]||[],eL=edit[k]||[];const rL=out[k]=out[k]||[];
    // 포털에서 삭제한 항목 → 시트 최신본에서도 제거
    const kept=new Set(eL.filter(o=>o._bi>=0).map(o=>o._bi));
    bL.forEach((b,i)=>{if(!kept.has(i)){const j=rL.findIndex(r=>r.name===b.name);if(j>-1)rL.splice(j,1);}});
    // 포털에서 변경/추가한 항목 → 필드 단위로 시트 최신본 위에 적용
    eL.forEach(e=>{
      if(e._bi>=0&&bL[e._bi]){
        const b=bL[e._bi];const ch={};let any=false;
        FIELDS[k].forEach(f=>{if(JSON.stringify(e[f])!==JSON.stringify(b[f])){ch[f]=e[f];any=true;}});
        const ak=ARR[k];const arrCh=[];
        if(ak)(e[ak]||[]).forEach((v,i2)=>{if(JSON.stringify(v)!==JSON.stringify((b[ak]||[])[i2])){arrCh.push([i2,v]);any=true;}});
        if(!any)return; // 내가 안 고친 항목 → 시트값 그대로 유지
        let r=rL.find(x=>x.name===b.name);
        if(!r){r=JSON.parse(JSON.stringify(e));delete r._bi;rL.push(r);return;} // 시트에서 사라졌으면 내 버전 추가
        Object.assign(r,ch);
        if(ak){r[ak]=r[ak]||[];arrCh.forEach(p=>{r[ak][p[0]]=p[1];});}
      }else{const r=JSON.parse(JSON.stringify(e));delete r._bi;rL.push(r);} // 신규 추가
    });
  });
  out.notice=JSON.parse(JSON.stringify(edit.notice||base.notice)); // 공지는 포털 전용
  out.parties=JSON.parse(JSON.stringify(edit.parties||base.parties||fresh.parties));
  out.tabsHidden=(edit.tabsHidden||base.tabsHidden||[]).slice();
  out.rosterCols=JSON.parse(JSON.stringify(edit.rosterCols||base.rosterCols||{talk:true,notice:true}));
  out.tabPerm=JSON.parse(JSON.stringify(edit.tabPerm||base.tabPerm||SNAP.tabPerm));
  out.auctionPrices=JSON.parse(JSON.stringify(edit.auctionPrices||base.auctionPrices||SNAP.auctionPrices));
  out.guildName=edit.guildName||base.guildName||fresh.guildName||'방탄한어른들';
  out.subTitle=edit.subTitle||base.subTitle||fresh.subTitle||'RF ONLINE NEXT · WELLS-4';
  out.basicHeaders=edit.basicHeaders;out.skillHeaders=edit.skillHeaders;
  return out;
}

async function remoteAuth(pw){
  if(!SYNC_URL)return false;
  try{
    const r=await fetch(SYNC_URL,{method:'POST',body:JSON.stringify({action:'auth',pw})});
    const j=await r.json();
    if(j&&j.ok&&j.token){authToken=j.token;role=j.role;return true;}
    return false;
  }catch(e){return false;}
}
async function remoteLoad(){
  if(!SYNC_URL||!authToken)return null;
  try{const r=await fetch(SYNC_URL,{method:'POST',body:JSON.stringify({action:'load',token:authToken}),signal:AbortSignal.timeout(9000)});
    const j=await r.json();return j&&j.data?j.data:null;}catch(e){return null;}
}
async function remoteSave(data){
  if(!SYNC_URL)return null; // 미설정
  if(!authToken)return 'err:인증이 만료되었습니다. 수정 모드를 다시 시작하세요';
  try{const r=await fetch(SYNC_URL,{method:'POST',body:JSON.stringify({token:authToken,data})});
    const j=await r.json();
    if(j&&j.ok)return true;
    if(j&&(j.err==='bad_pw'||j.err==='bad_token'))return 'pw';
    return 'err:'+((j&&j.err)||'unknown');}catch(e){return 'err:'+e.message;}
}

function listByRoster(kind,group){

function sortableTable(cols,rows,opts={}){
  let sortK=opts.defaultSort||null,dir=opts.defaultDir||-1,filter='';
  const wrap=document.createElement('div');
  if(opts.search!==false){
    const sd=document.createElement('div');sd.className='search';
    const inp=document.createElement('input');inp.placeholder='캐릭터명 검색…';
    inp.oninput=()=>{filter=inp.value.trim().toLowerCase();draw();};
    sd.appendChild(inp);
    const h=document.createElement('span');h.className='hint';h.textContent='열 제목 클릭 = 정렬';
    sd.appendChild(h);wrap.appendChild(sd);
  }
  const tw=document.createElement('div');tw.className='tblwrap';
  const table=document.createElement('table');tw.appendChild(table);wrap.appendChild(tw);
  function draw(){
    let data=rows().filter(r=>!filter||String(r.name||'').toLowerCase().includes(filter));
    const vis=cols.filter(c=>!c.hidden);
    if(sortK!=null){
      const col=cols.find(c=>c.k===sortK);
      if(col){
        data=[...data].sort((a,b)=>{
          let x=col.val?col.val(a):a[sortK],y=col.val?col.val(b):b[sortK];
          if(col.num){x=(x==null||x==='')?-Infinity:+x;y=(y==null||y==='')?-Infinity:+y;return (x-y)*dir;}
          return String(x||'').localeCompare(String(y||''),'ko')*dir;
        });
      }
    }
    table.innerHTML='<thead><tr>'+vis.map(c=>`<th class="sortable ${c.cls||''}" data-k="${c.k}">${c.label} <span class="arr">${sortK===c.k?(dir>0?'▲':'▼'):'⇅'}</span></th>`).join('')+'</tr></thead>';
    const tb=document.createElement('tbody');
    data.forEach((r,i)=>{
      const tr=document.createElement('tr');
      vis.forEach(c=>{
        const td=document.createElement('td');td.className=c.cls||'';
        c.cell(td,r,i);
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    table.appendChild(tb);
    table.querySelectorAll('th').forEach(th=>th.onclick=()=>{
      const k=th.dataset.k;
      if(sortK===k)dir*=-1;else{sortK=k;const cc=cols.find(c=>c.k===k);dir=(cc&&cc.num)?-1:1;}
      draw();
      if(typeof syncStick==='function')syncStick();
    });
  }
  draw();
  return wrap;
}

let curEditable=false; // 현재 렌더 중인 탭의 편집 허용 여부
function locTabs(key,rerender){
  const wrap=document.createElement('div');wrap.className='search';
  wrap.style.marginBottom='10px';
  ['전체','내근','외근'].forEach(v=>{
    const b=document.createElement('button');b.className='btn'+(locFilter[key]===v?' primary':'');
    b.textContent=v;b.onclick=()=>{locFilter[key]=v;rerender();};
    wrap.appendChild(b);
  });
  const info=document.createElement('span');info.className='hint';
  info.textContent='위치별 보기 · 순위는 내근/외근 그룹별로 1위부터 · 수정 모드에서 위치 칸 클릭 = 전환';
  wrap.appendChild(info);

// 위치는 캐릭터명 기준으로 장비/스킬 탭이 공유
// 위치 기준 = 공지 탭 길드원 명단 (장비·스킬·마유 탭은 이를 따라감)
function locOf(name,self){
  const r=(cur().notice&&cur().notice.roster||[]).find(x=>x[0]===name);
  if(r)return r[5]==='외근'?'외근':'내근';
  const b=cur().basic.find(x=>x.name===name);
  if(b&&b.loc)return b.loc;
  return (self&&self.loc)||'내근';
}
function setLoc(name,v,self){
  const r=(cur().notice&&cur().notice.roster||[]).find(x=>x[0]===name);
  if(r)r[5]=v; // 명단이 원본
  const b=cur().basic.find(x=>x.name===name);if(b)b.loc=v;
  const s=cur().skills.find(x=>x.name===name);if(s)s.loc=v;
  if(self)self.loc=v;
}

/* ===== 공대 편성 ===== */
const ROLE_COLORS={};
function roleClass(label0){
  const label=String(label0||'').replace(/\s*\d+$/,'').trim(); // 버프1/버프2 → 같은 색
  const p=['role-g','role-p','role-v','role-b','role-a'];
  if(!(label in ROLE_COLORS)){
    const used=Object.values(ROLE_COLORS);
    ROLE_COLORS[label]=p.find(c=>!used.includes(c))||p[used.length%p.length];
  }
  return ROLE_COLORS[label];
}
function memberPool(){
  const s=new Set();
  cur().basic.forEach(b=>s.add(b.name));
  (cur().notice.roster||[]).forEach(r=>s.add(r[0]));
  cur().skills.forEach(k=>s.add(k.name));
  return [...s].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ko'));
}
function renderParty(){
  const s=document.getElementById('sec-party');const E=can('party');curEditable=E;
  const P=cur().parties||{};
  s.innerHTML=Object.keys(P).map(k=>`
    <div class="panel"><h2>${k} 편성 <span class="sub" id="cnt-${k}"></span>
      <span class="right">${E?`<button class="btn" data-addteam="${k}">+ 공대</button><button class="btn" data-addrow="${k}">+ 인원 줄</button>`:''}</span></h2>
      <div class="pflex">
        <div class="pleft"><div class="pwrap"><table class="ptbl" id="pt-${k}"></table></div>
          <div class="pcount" id="dup-${k}"></div></div>
        <div class="pright" id="pn-${k}"></div>
      </div></div>`).join('');
  Object.keys(P).forEach(key=>{
    const grp=P[key],tb=document.getElementById('pt-'+key);
    if(!grp.notes)grp.notes={};
    const rows=Math.max(1,...grp.teams.map(t=>t.members.length));
    const seen={},dups=new Set();
    grp.teams.forEach(t=>t.members.forEach(m=>{if(!m)return;if(seen[m])dups.add(m);seen[m]=1;}));
    const nCols=grp.teams.length;
    let html='<colgroup>'+grp.teams.map(()=>'<col>').join('')+'</colgroup>';
    // 최상단 제목 행 (낙원 / 전장)
    html+=`<tr class="titlerow"><th colspan="${nCols}">${key}</th></tr>`;
    // 역할 행 (동일 역할 병합)
    html+='<tr class="rolerow">';
    for(let i=0;i<nCols;i++){
      const lab=grp.roles[i]||'';
      html+=`<th class="role ${roleClass(lab)}" data-k="${key}" data-i="${i}">${lab||'—'}</th>`;
    }
    html+='</tr><tr class="teamrow">'+
      grp.teams.map((t,ti)=>`<th class="tname" data-k="${key}" data-t="${ti}">${t.name}</th>`).join('')+'</tr>';
    for(let r=0;r<rows;r++){
      html+='<tr>'+grp.teams.map((t,ti)=>{
        const m=t.members[r]||'';
        const cls='mem'+(m?(dups.has(m)?' dup':''):' empty');
        return `<td class="${cls}" data-k="${key}" data-t="${ti}" data-r="${r}">${m||'—'}</td>`;
      }).join('')+'</tr>';
    }
    tb.innerHTML=html;
    const total=grp.teams.reduce((a,t)=>a+t.members.filter(Boolean).length,0);
    document.getElementById('cnt-'+key).textContent=`${nCols}개 공대 · ${total}명`;
    const dl=document.getElementById('dup-'+key);
    dl.innerHTML=dups.size?`<span style="color:var(--red)">⚠ 중복 배치: ${[...dups].join(', ')}</span>`:'중복 배치 없음';

    // ---- 우측: 역할별 플레이 방법 ----
    const uniq=[];grp.roles.slice(0,nCols).forEach(r0=>{const l=r0||'';if(!uniq.includes(l))uniq.push(l);});
    const pn=document.getElementById('pn-'+key);
    pn.innerHTML='<div class="pcount" style="margin:0 0 8px">플레이 방법</div>'+uniq.map(lab=>{
      const teams=grp.teams.filter((t,ti)=>(grp.roles[ti]||'')===lab).map(t=>t.name).join(', ');
      void teams;
      const txt=grp.notes[lab]||'';
      return `<div class="notecard"><span class="nh ${roleClass(lab)}">${lab||'—'} <span style="opacity:.75;font-weight:400">${teams}</span></span>
        <div class="nb ${txt?'':'empty'}" data-k="${key}" data-lab="${lab}">${txt?escapeHTML(txt):(E?'클릭해서 입력':'—')}</div></div>`;
    }).join('');
    if(!E)return;
    // 메모 편집
    pn.querySelectorAll('.nb').forEach(nb=>{
      nb.onclick=()=>{
        if(nb.querySelector('textarea'))return;
        const k=nb.dataset.k,lab=nb.dataset.lab;
        const old=cur().parties[k].notes[lab]||'';
        const ta=document.createElement('textarea');ta.value=old;
        ta.placeholder='예) 라인 유지 · 상대 진입 저지 · 버프 대기';
        nb.textContent='';nb.appendChild(ta);ta.focus();
        ta.onblur=()=>{const v=ta.value;
          if(v!==old){cur().parties[k].notes[lab]=v;setDirty(dirty+1);}
          renderParty();};
      };
    });
    // 인원 셀 → 드롭다운
    tb.querySelectorAll('td.mem').forEach(td=>{
      td.onclick=()=>{
        if(td.querySelector('select'))return;
        const k=td.dataset.k,ti=+td.dataset.t,r=+td.dataset.r;
        const t=cur().parties[k].teams[ti];const old=t.members[r]||'';
        const sel=document.createElement('select');sel.className='cellinp';
        const pool=memberPool();const opts=['',...pool];
        if(old&&!pool.includes(old))opts.splice(1,0,old);
        opts.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v===''?'— 비움 —':v;if(v===old)o.selected=true;sel.appendChild(o);});
        td.textContent='';td.appendChild(sel);sel.focus();
        const done=()=>{const v=sel.value;
          if(v!==old){t.members[r]=v;setDirty(dirty+1);}
          renderParty();};
        sel.onchange=done;sel.onblur=done;
      };
    });
    // 역할명 / 공대명 편집
    tb.querySelectorAll('th.role').forEach(th=>{
      th.onclick=()=>{const k=th.dataset.k,i0=+th.dataset.i;
        const g2=cur().parties[k];const old=g2.roles[i0]||'';
        const nv=prompt(g2.teams[i0].name+' 역할명 (입력한 그대로 저장됩니다)',old);
        if(nv!==null&&nv.trim()!==old){
          const label=nv.trim();
          g2.roles[i0]=label;
          if(g2.notes[old]&&!g2.notes[label]){g2.notes[label]=g2.notes[old];delete g2.notes[old];}
          setDirty(dirty+1);renderParty();}
      };
    });
    tb.querySelectorAll('th.tname').forEach(th=>{
      th.onclick=()=>{const k=th.dataset.k,ti=+th.dataset.t;
        const t=cur().parties[k].teams[ti];
        const nv=prompt('공대 이름 (빈칸 입력 시 이 공대 삭제)',t.name);
        if(nv===null)return;
        if(nv.trim()===''){if(confirm(t.name+' 공대를 삭제할까요?')){cur().parties[k].teams.splice(ti,1);cur().parties[k].roles.splice(ti,1);setDirty(dirty+1);renderParty();}return;}
        if(nv.trim()!==t.name){t.name=nv.trim();setDirty(dirty+1);renderParty();}
      };
    });
  });
  s.querySelectorAll('[data-addteam]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.addteam,g=cur().parties[k];
    g.teams.push({name:(g.teams.length+1)+'공대',members:['']});
    g.roles.push(g.roles[g.roles.length-1]||'');
    setDirty(dirty+1);renderParty();});
  s.querySelectorAll('[data-addrow]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.addrow;cur().parties[k].teams.forEach(t=>t.members.push(''));
    setDirty(dirty+1);renderParty();});
}

      <div class="note">입찰 다이아는 길드 금고 귀속 후 전 길드원(부캐 제외) 매월 균등 분배</div></div>`;
  // --- 자동 집계 ---
  const H=cur().skillHeaders||[];
  const idxOf=n=>H.findIndex(h=>String(h).trim()===n);
  const MAU_ITEMS=['템페','헤라','오딘','토르','타이폰'];
  const LAUNCHERS=['케이론PC','케이론IC','카드모스PC'];
  const pmap={};cur().basic.forEach(b=>pmap[b.name]=b.power);
  const memoOf=n=>{const e=(cur().mau||[]).find(x=>x.name===n);return e?(e.memo||''):'';};
  const setMemo=(n,v)=>{const L=cur().mau||(cur().mau=[]);const e=L.find(x=>x.name===n);
    if(e)e.memo=v;else L.push({name:n,memo:v});};
  const sum=(rec,names)=>names.map(nm=>{const i=idxOf(nm);const v=i>=0?String((rec.vals||[])[i]||'').trim():'';
    return v?`${nm} ${v}`:'';}).filter(Boolean).join(' · ');
  const all=[...listByRoster('skills','내근'),...listByRoster('skills','외근')];
  const rows=()=>all.map(rec=>({name:rec.name,power:pmap[rec.name]??null,
      mau:sum(rec,MAU_ITEMS),launcher:sum(rec,LAUNCHERS),ref:rec}))
    .filter(r=>!mauOnlyActive||r.mau||r.launcher||memoOf(r.name))
    .sort((a,b)=>(b.power||0)-(a.power||0));
  const cols=[
    {k:'_rank',label:'#',cls:'center',cell:(td,r,i)=>td.innerHTML=`<span class="rank ${i<3?'r'+(i+1):''}">${i+1}</span>`},
    {k:'name',label:'캐릭명',cell:(td,r)=>td.innerHTML=`<b>${r.name}</b>`},
    {k:'power',label:'전투력',num:true,cell:(td,r)=>td.innerHTML=powerHTML(r.power)},
    {k:'mau',label:'마유 (템페·헤라·오딘·토르·타이폰)',cell:(td,r)=>{
      td.innerHTML=r.mau?`<span style="color:var(--amber);font-size:12px">${r.mau}</span>`:'<span style="color:#3A4966">—</span>';}},
    {k:'launcher',label:'런처 (케이론PC·IC·카드모스PC)',cell:(td,r)=>{
      td.innerHTML=r.launcher?`<span style="color:var(--cyan);font-size:12px">${r.launcher}</span>`:'<span style="color:#3A4966">—</span>';}},
    {k:'memo',label:'비고',val:r=>memoOf(r.name),cell:(td,r)=>{
      td.textContent=memoOf(r.name)||'—';td.style.color='var(--mut)';
      editableCell(td,()=>memoOf(r.name),x=>setMemo(r.name,x));}}
  ];
  const host=document.getElementById('mauHost');
  const t=sortableTable(cols,rows,{defaultSort:'power',defaultDir:-1});
  host.appendChild(t);t.querySelector('.tblwrap').classList.add('frz');
  document.getElementById('tglActive').onclick=()=>{mauOnlyActive=!mauOnlyActive;renderAuction();};
  // --- 시작가 ---
  const pb=s.querySelector('#priceTbl tbody');
  (cur().auctionPrices||[]).forEach((row,i)=>{
    const tr=document.createElement('tr');
    const t0=document.createElement('td');t0.textContent=row[0]||'—';
    editableCell(t0,()=>cur().auctionPrices[i][0],x=>{cur().auctionPrices[i][0]=x;});tr.appendChild(t0);
    const t1=document.createElement('td');t1.className='num';t1.textContent=row[1]||'—';
    editableCell(t1,()=>cur().auctionPrices[i][1],x=>{cur().auctionPrices[i][1]=x;});tr.appendChild(t1);
    if(E){const t2=document.createElement('td');t2.className='center';
      t2.innerHTML='<span style="color:var(--red);cursor:pointer;font-weight:700">×</span>';
      t2.onclick=()=>{cur().auctionPrices.splice(i,1);setDirty(dirty+1);renderAuction();};tr.appendChild(t2);}
    pb.appendChild(tr);
  });
  const ap=document.getElementById('addPrice');
  if(ap)ap.onclick=()=>{cur().auctionPrices.push(['새 항목','']);setDirty(dirty+1);renderAuction();};
  syncStick();
}

/* ===== 계산기 ===== */
function renderCalc(){
  const s=document.getElementById('sec-calc');
  s.innerHTML=`<div class="calc">
    <div class="panel"><h2>영웅 스킬 효율 <span class="sub">낮을수록 유리</span></h2>
      <table><thead><tr><th>등급</th><th>필요 갯수</th><th>경매장 가격</th><th>효율</th></tr></thead><tbody id="c1"></tbody></table></div>
    <div class="panel"><h2>노드작 효율 <span class="sub">가격÷기대노드량 · 낮을수록 유리</span></h2>
      <table><thead><tr><th>등급</th><th>가격</th><th>효율</th></tr></thead><tbody id="c2"></tbody></table>
      <div class="note">기대 노드량 = Σ(실패확률 × 강화 노드) · 확률 0/0.15/0.30/0.45/0.55</div></div>
    <div class="panel"><h2>크레딧 환산 <span class="sub">높을수록 유리</span></h2>
      <table><thead><tr><th>아이템</th><th>다야</th><th>경매가</th><th>환산값</th></tr></thead><tbody id="c3"></tbody></table></div>
  </div>`;
  const hero=[["일반",3000,0.024],["고급",300,0.169],["희귀",20,2.75]];
  const nodes=[["4T 희귀",14,[300,300,450,450,600]],["5T 희귀",16,[400,400,600,600,800]],["6T 희귀",21,[600,600,900,900,1200]],["1T 영웅",61,[1500,1500,2250,2250,3000]]];
  const probs=[0,0.15,0.3,0.45,0.55];
  const creds=[["50만 크레딧",10,5.5,500000],["깊은 곳의 파편",10,0.033,5000]];
  const c1=document.getElementById('c1'),c2=document.getElementById('c2'),c3=document.getElementById('c3');
  hero.forEach((h,i)=>c1.insertAdjacentHTML('beforeend',`<tr><td>${h[0]}</td><td><input id="h${i}q" value="${h[1]}"></td><td><input id="h${i}p" value="${h[2]}"></td><td class="res" id="h${i}r"></td></tr>`));
  nodes.forEach((n,i)=>c2.insertAdjacentHTML('beforeend',`<tr><td>${n[0]}</td><td><input id="n${i}p" value="${n[1]}"></td><td class="res" id="n${i}r"></td></tr>`));
  creds.forEach((c,i)=>c3.insertAdjacentHTML('beforeend',`<tr><td>${c[0]}</td><td><input id="d${i}a" value="${c[1]}"></td><td><input id="d${i}p" value="${c[2]}"></td><td class="res" id="d${i}r"></td></tr>`));
  function upd(){
    hero.forEach((h,i)=>{const q=+h1(`h${i}q`),p=+h1(`h${i}p`);el(`h${i}r`).textContent=(q&&p)?(q*p).toFixed(1):'—';});
    nodes.forEach((n,i)=>{const p=+h1(`n${i}p`);const exp=n[2].reduce((a,v,j)=>a+v*probs[j],0);el(`n${i}r`).textContent=p?(p/exp).toFixed(5):'—';});
    creds.forEach((c,i)=>{const a=+h1(`d${i}a`),p=+h1(`d${i}p`);el(`d${i}r`).textContent=(a&&p)?Math.round(a/p*c[3]).toLocaleString('ko-KR'):'—';});
  }
  const el=id=>document.getElementById(id),h1=id=>el(id).value;
  s.querySelectorAll('input').forEach(inp=>inp.oninput=upd);upd();
}

    <ul>
      <li>낙원·전장 편성표. 인원 칸 클릭 → 길드원 드롭다운에서 선택(비움도 가능).</li>
      <li>역할명 클릭 → 이름 변경(입력한 그대로 저장). 공대명 클릭 → 이름 변경, <b>빈칸 입력 시 해당 공대 삭제</b>.</li>
      <li><b>+ 공대</b> / <b>+ 인원 줄</b>로 확장.</li>
      <li>오른쪽 <b>플레이 방법</b> 카드에 역할별 전략을 적을 수 있습니다.</li>
      <li>같은 사람이 두 공대에 들어가면 <b>빨갛게 표시되고 하단에 중복 경고</b>가 뜹니다.</li>
    </ul>

    <h3>6. 경매 탭</h3>
    <ul>
      <li><b>MAU/런처 현황</b>은 캐릭터 목록·전투력·마유 탭에서 <b>자동 집계</b>됩니다. 직접 입력하는 항목은 비고뿐입니다.</li>
      <li>투력순 정렬이라 “투력순 우선 분배” 적용 시 위에서부터 보면 됩니다.</li>
      <li><b>[진행 중만] / [전체 보기]</b> 버튼으로 표시 범위를 바꿉니다.</li>
      <li><b>경매 시작가</b>는 이 탭에서만 관리합니다(항목 추가·삭제 가능).</li>
    </ul>

    <h3>7. 저장과 병합</h3>
    <div class="step"><b>1</b><div>수정 → 아래 바에서 변경 건수 확인</div></div>
    <div class="step"><b>2</b><div><b>💾 저장</b> → 확인 (누르지 않으면 반영 안 됨)</div></div>
    <div class="step"><b>3</b><div>저장 시 시트 최신본을 불러와 <b>내가 고친 부분만</b> 덮어씁니다. 그 사이 다른 사람이 시트에서 수정한 내용은 유지됩니다.</div></div>
    <div class="warn">수정 모드를 오래 켜둘수록 충돌 가능성이 커집니다. <b>고친 뒤 바로 저장</b>하세요. 같은 칸을 동시에 고치면 나중에 저장한 쪽이 남습니다.</div>

    <h3>8. 업데이트 · 배포</h3>
    <p>코드를 수정했다면 <b>반드시 아래 방식으로</b> 배포해야 링크 주소가 유지됩니다.</p>
    <div class="step"><b>1</b><div>Apps Script 편집기 → 우측 상단 <b>배포</b> → <b>배포 관리</b> (※ “새 배포” 아님)</div></div>
    <div class="step"><b>2</b><div>연필(수정) 아이콘 클릭 → 버전에서 <b>새 버전</b> 선택</div></div>
    <div class="step"><b>3</b><div><b>배포</b> 클릭 → 브라우저에서 <span class="kbd">Ctrl+F5</span>로 새로고침</div></div>

    <h3>9. 백업과 복구</h3>
    <ul>
      <li><b>정기 백업</b> — 구글 시트에서 파일 → 사본 만들기. 큰 변경 전에는 꼭 하세요.</li>
      <li><b>수동 백업</b> — 포털 맨 아래 <b>변경사항 내보내기(JSON)</b> 버튼으로 파일 저장, <b>가져오기</b>로 복원.</li>
      <li><b>초기화</b> — 수정 모드 하단 <b>스냅샷으로 초기화</b>는 초기 데이터로 되돌립니다. 저장해야 시트에 반영되니 신중히 사용하세요.</li>
      <li>시트의 <b>WEB_DATA</b> 탭에는 전체 데이터가 JSON으로 보관됩니다. 직접 편집하지 마세요.</li>
    </ul>

    <h3>10. 문제 해결</h3>
    <table><thead><tr><th>증상</th><th>조치</th></tr></thead><tbody>
      <tr><td>비밀번호가 안 먹힘</td><td>재배포(새 버전) 했는지 확인. Code.gs와 화면 파일을 함께 교체했는지 확인</td></tr>
      <tr><td>저장 실패 · 인증 만료</td><td>수정 모드를 껐다 다시 켜고 저장 (토큰 12시간)</td></tr>
      <tr><td>변경이 화면에 안 보임</td><td><span class="kbd">Ctrl+F5</span> 강제 새로고침</td></tr>
      <tr><td>드롭다운에 새 장비가 없음</td><td>시트 [드랍다운리스트] 탭에 추가 후 새로고침</td></tr>
      <tr><td>인원이 탭에 안 보임</td><td>공지 탭 길드원 명단에 등록되어 있는지 확인</td></tr>
    </tbody></table>
  </div>`;
}

/* ===== 통계 ===== */
function renderStats(){
  const powers=cur().basic.map(b=>b.power).filter(p=>p);
  const items=[["캐릭터",cur().basic.length],
    ["평균 전투력",powers.length?Math.round(powers.reduce((a,b)=>a+b,0)/powers.length).toLocaleString():'—'],
    ["최고 전투력",powers.length?Math.max(...powers).toLocaleString():'—'],
    ["길드원 명단",cur().notice.roster.length],
    ["본캐 / 부캐",cur().notice.roster.filter(r=>r[4]!=='부캐').length+' / '+cur().notice.roster.filter(r=>r[4]==='부캐').length]];
  document.getElementById('statStrip').innerHTML=items.map(([l,v])=>`<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
}

function renderBrand(){

  document.getElementById('brandSub').textContent=cur().subTitle||'RF ONLINE NEXT · WELLS-4';

document.getElementById('brandName').onclick=()=>{

}
function renderAll(){buildNav();renderBrand();renderStats();renderNotice();renderBasic();renderSkill();renderMau();renderParty();renderAuction();renderCalc();renderHelp();renderHelpAdmin();

document.getElementById('exportBtn').onclick=()=>{

document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;

  rd.onload=()=>{
    try{const obj=JSON.parse(rd.result);
      if(!obj.basic||!obj.skills)throw 0;
      modal({title:'데이터 가져오기',body:`캐릭터 ${obj.basic.length}명 데이터를 불러옵니다. 현재 데이터를 덮어씁니다.`,okText:'가져오기',onOk:async()=>{
        D=migrate(obj);renderAll();toast('가져오기 완료 — 저장 버튼을 눌러야 시트에 반영됩니다');}});
    }catch(err){toast('올바르지 않은 파일입니다');}
  };
  rd.readAsText(f);e.target.value='';
};


/* ===== 헤더 고정: 화면 상단에 떠서 따라오는 헤더 ===== */
const floats=[];
const headerH=()=>{const h=document.querySelector('header');return h?h.offsetHeight:0;};

function colVars(w){ // 좌측 고정 열 오프셋 계산
  const tr=w.querySelector('thead tr');if(!tr)return;
  const c=tr.children;
  if(c[0])w.style.setProperty('--c1',c[0].offsetWidth+'px');
  if(c[0]&&c[1])w.style.setProperty('--c2',(c[0].offsetWidth+c[1].offsetWidth)+'px');
}

function clearFloats(){floats.forEach(f=>f.el.remove());floats.length=0;}

function attachFloat(wrap){
  const table=wrap.querySelector('table');if(!table)return;
  const thead=table.querySelector('thead');if(!thead)return;
  const el=document.createElement('div');el.className='floathdr';
  const inn=document.createElement('div');inn.className='floathdr-in'+(wrap.classList.contains('frz')?' frz':'');
  const t2=document.createElement('table');
  t2.appendChild(thead.cloneNode(true));
  inn.appendChild(t2);el.appendChild(inn);document.body.appendChild(el);
  const rec={el,inn,t2,wrap,table,thead};
  // 원본 헤더 클릭과 연동 (정렬)
  [...t2.querySelectorAll('th')].forEach((th,i)=>{
    th.onclick=()=>{const o=thead.querySelectorAll('th')[i];if(o)o.click();};
  });
  // 가로 스크롤 동기화 (양방향)
  wrap.addEventListener('scroll',()=>{inn.scrollLeft=wrap.scrollLeft;});
  inn.addEventListener('scroll',()=>{if(Math.abs(inn.scrollLeft-wrap.scrollLeft)>1)wrap.scrollLeft=inn.scrollLeft;});
  floats.push(rec);
  sizeFloat(rec);
  return rec;
}

function sizeFloat(r){
  const ths=[...r.thead.querySelectorAll('th')],ths2=[...r.t2.querySelectorAll('th')];
  r.t2.style.width=r.table.offsetWidth+'px';
  ths.forEach((th,i)=>{if(ths2[i]){const w=th.offsetWidth+'px';ths2[i].style.width=w;ths2[i].style.minWidth=w;}});
  r.inn.style.setProperty('--c1',getComputedStyle(r.wrap).getPropertyValue('--c1'));
  r.inn.style.setProperty('--c2',getComputedStyle(r.wrap).getPropertyValue('--c2'));
  r.el.style.height=(r.thead.offsetHeight||34)+'px';
  r.inn.style.height=(r.thead.offsetHeight+20||54)+'px';
}

function positionFloats(){
  const top=headerH();
  floats.forEach(r=>{
    const wr=r.wrap.getBoundingClientRect();
    const hh=r.thead.offsetHeight||34;
    const on=wr.top<top && wr.bottom>top+hh+10;
    if(!on){r.el.style.display='none';return;}
    r.el.style.display='block';
    r.el.style.top=top+'px';
    r.el.style.left=wr.left+'px';
    r.el.style.width=r.wrap.clientWidth+'px';
    r.inn.scrollLeft=r.wrap.scrollLeft;
  });
}

function refreshFloats(){
  clearFloats();
  document.querySelectorAll('main section.on .tblwrap.frz').forEach(w=>{colVars(w);attachFloat(w);});
  positionFloats();
}
function syncStick(){ // 렌더 후 호출
  document.querySelectorAll('.tblwrap.frz').forEach(colVars);
  requestAnimationFrame(refreshFloats);
}
addEventListener('scroll',positionFloats,{passive:true});
addEventListener('resize',()=>{floats.forEach(sizeFloat);positionFloats();});

/* ===== init ===== */
async function bootLoad(){
  const dot=document.getElementById('srcDot'),txt=document.getElementById('srcTxt');
  txt.textContent='시트에서 불러오는 중…';
  try{
    const r=await fetch(SYNC_URL+'?api=1',{signal:AbortSignal.timeout(15000)});
    const j=await r.json();
    if(j&&j.ok){
      if(j.dd)SERVER_DD=j.dd;
      if(j.data&&j.data.basic){
        D=migrate(j.data);
        dot.classList.add('live');txt.textContent='실시간 · 시트 동기화';
        renderAll();return;
      }
    }
    txt.textContent='시트에 저장된 데이터 없음';
  }catch(e){
    txt.textContent='서버 연결 실패 — SYNC_URL 확인 필요';
  }
  renderAll();
}
bootLoad();
